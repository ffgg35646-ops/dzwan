name: Zajel Web Build

on:
  push:
    branches: [main]
    paths:
      - "zajel-web/**"
      - ".github/workflows/zajel-web-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "zajel-web/**"
      - ".github/workflows/zajel-web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zajel-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
