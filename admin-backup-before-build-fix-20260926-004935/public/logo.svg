<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB31A"/>
      <stop offset="100%" stop-color="#F27A16"/>
    </linearGradient>

    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD84A"/>
      <stop offset="100%" stop-color="#FFAA16"/>
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#FFF7E8" stop-opacity=".82"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
        flood-color="#D56F13" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- glass frame -->
  <rect
    x="18"
    y="18"
    width="864"
    height="264"
    rx="42"
    fill="url(#glass)"
    stroke="#F3A31A"
    stroke-width="4"
    filter="url(#shadow)"
  />

  <!-- motion lines -->
  <path
    d="M85 118 C118 99 146 99 176 108"
    fill="none"
    stroke="#FFB91F"
    stroke-width="12"
    stroke-linecap="round"
  />

  <path
    d="M78 145 C113 128 140 129 163 137"
    fill="none"
    stroke="#F47C16"
    stroke-width="7"
    stroke-linecap="round"
  />

  <path
    d="M82 168 C105 158 124 159 143 164"
    fill="none"
    stroke="#FFC928"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- small location mark -->
  <path
    d="M448 52
       C448 38 459 28 473 28
       C487 28 498 38 498 52
       C498 72 473 91 473 91
       C473 91 448 72 448 52Z"
    fill="url(#orange)"
  />

  <circle cx="473" cy="51" r="7" fill="#FFFFFF"/>

  <!-- Arabic brand -->
  <text
    x="455"
    y="164"
    text-anchor="middle"
    direction="rtl"
    unicode-bidi="bidi-override"
    font-family="Cairo, Tajawal, Arial, sans-serif"
    font-size="105"
    font-weight="800"
    fill="url(#orange)"
  >دزوان</text>

  <!-- spoon / motion underline -->
  <path
    d="M190 193
       C305 224 474 222 637 191"
    fill="none"
    stroke="url(#yellow)"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- spoon bowl -->
  <ellipse
    cx="671"
    cy="184"
    rx="36"
    ry="22"
    fill="url(#yellow)"
    transform="rotate(-14 671 184)"
  />

  <!-- English name -->
  <text
    x="455"
    y="248"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="9"
    fill="#7B4319"
  >DZWAN</text>
</svg>
